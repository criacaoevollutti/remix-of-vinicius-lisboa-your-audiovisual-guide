### Netlify configuration for TanStack Start (SSR via Nitro)
#
# The `netlify` Nitro preset is activated in vite.config.ts when the NETLIFY
# env var is set. Nitro emits the SSR handler at
# `.netlify/functions-internal/server` and the client build lands in
# `dist/client` — we publish that folder so the hashed CSS/JS assets resolve.

[build]
  command = "bun run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  status = 200
  to = "/.netlify/functions/server"
