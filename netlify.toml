### Netlify configuration for TanStack Start (SSR via Nitro)
#
# The `netlify` Nitro preset is activated in vite.config.ts when the NETLIFY
# env var is set. Nitro's Netlify preset emits the deployable public output in
# `dist`, while the SSR handler is generated under `.netlify/functions-internal`.

[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  status = 200
  to = "/.netlify/functions/server"
